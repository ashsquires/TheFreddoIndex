<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src https://ectikpmaidqobqfsqife.supabase.co; connect-src https://ectikpmaidqobqfsqife.supabase.co; base-uri 'none'; form-action 'self'"><title>Freddo operations</title>
<style>body{font:16px/1.5 system-ui,sans-serif;background:#f8f6fa;color:#292333;max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0}h2{margin-top:28px}button,input,select,textarea{font:inherit;border:1px solid #b8b0c2;border-radius:6px;padding:9px;max-width:100%;box-sizing:border-box}button{cursor:pointer;background:#55346c;color:white}button:disabled{opacity:.55;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #da8b00;outline-offset:2px}label{display:block;margin:10px 0}input,textarea,select{display:block;width:100%}#login{max-width:400px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}.card{background:white;border:1px solid #ded7e5;border-radius:12px;padding:20px;overflow-wrap:anywhere}.muted{color:#62596c}.warning{border-left:5px solid #af5d00}.prices{font-size:19px;font-weight:600}.actions{display:flex;gap:8px;flex-wrap:wrap}details{margin-top:16px}summary{cursor:pointer}dialog{border:0;border-radius:12px;max-width:90vw;max-height:90vh}dialog img{max-width:100%;max-height:65vh;display:block}dialog::backdrop{background:#0008}ul{padding-left:20px}#status{min-height:24px}small{display:block} [hidden]{display:none!important}</style></head>
<body><header><div><h1>Freddo operations</h1><p class="muted">Private collection, evidence and review</p></div><div class="actions"><button id="refresh" hidden>Refresh</button><button id="logout" hidden>Sign out</button></div></header>
<p id="status" role="status" aria-live="polite">Checking your access…</p>
<form id="login" hidden><label>Email<input type="email" name="email" autocomplete="email" required></label><button>Send sign-in link</button></form>
<main id="dashboard" hidden><section aria-labelledby="run-heading"><h2 id="run-heading">Daily collection</h2><div id="run" class="card"></div></section><section aria-labelledby="retailer-heading"><h2 id="retailer-heading">Retailers</h2><div id="retailers" class="grid"></div></section><section aria-labelledby="index-heading"><h2 id="index-heading">Private daily index</h2><div id="index" class="card"></div></section><section aria-labelledby="jobs-heading"><h2 id="jobs-heading">Backups and storage</h2><div id="jobs" class="card"></div></section><section aria-labelledby="alerts-heading"><h2 id="alerts-heading">Notifications</h2><div id="alerts" class="card"></div></section></main>
<dialog id="preview"><button id="close-preview">Close screenshot</button><p id="capture-time"></p><img id="screenshot" alt="Retailer product page evidence"></dialog>
<script type="module" src="/assets/monitor.js"></script></body></html>
